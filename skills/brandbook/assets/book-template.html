        `Spad ${p.bleed_mm ?? 3} mm i ${p.safe_mm ?? 3} mm marginesu bezpieczeństwa; wartości potwierdzić z drukarnią.`,
        "Drobny tekst i kod kreskowy w 100% K z nadrukiem.",
        "Uszlachetnienia i wykrojnik na osobnych warstwach, jako kolory dodatkowe nazwane tak, jak chce drukarnia.",
        "Wykrojnik od drukarni, nie rysowany na oko.",
        "Próbny wydruk na docelowym papierze przed zatwierdzeniem koloru."
      ] : [
        `Export to ${p.pdf || "PDF/X-4"} with the ${p.profile || "printer's"} profile.`,
        `${p.bleed_mm ?? 3} mm bleed and ${p.safe_mm ?? 3} mm safe margin; confirm with the printer.`,
        "Small text and barcode in 100% K, overprinting.",
        "Finishes and dieline on separate layers, as spot colours named the way the printer wants.",
        "The dieline from the printer, not drawn by eye.",
        "A proof on the final paper before the colour is approved."
      ]).map((x) => h("li", {}, x)))
    ];
  },
  files() {
    return rows([[T.filePath, h("span", {}, T.what, " / ", T.printReady)], ...(B.files || []).map((f) => [h("a", { href: asset(f.path) }, f.path), `${f.what}${f.print_ready === true ? ` / ${T.yes}` : f.print_ready === false ? ` / ${T.noWord}` : ""}`])]);
  },
  decisions() {
    const d = B.decisions || [];
    return [
      d.length ? rows(d.map((x) => [x.what, h("div", {}, h("div", {}, `${T.decWho}: ${x.who || "?"}, ${T.decBy.toLowerCase()}: ${x.by || "?"}`), x.recommendation ? h("div", { class: "muted" }, `${T.decRec}: ${x.recommendation}`) : null)])) : null,
      (B.changelog || []).length ? [h("h3", {}, T.changelog), rows(B.changelog.map((c) => [`${c.version}, ${c.date}`, c.change]))] : null
    ];
  }
};

function dontCard(d, primary) {
  const st = { maxHeight: "52px", maxWidth: "58%", width: "auto", height: "auto" };
  let box = { background: bg ? bg.hex : "#fff" };
  if (d.demo === "stretch") st.transform = "scaleX(1.5)";
  if (d.demo === "rotate") st.transform = "rotate(-16deg)";
  if (d.demo === "shadow") st.filter = "drop-shadow(5px 5px 0 rgba(0,0,0,.45))";
  if (d.demo === "recolor") st.filter = "hue-rotate(150deg) saturate(3)";
  if (d.demo === "busy") box = { backgroundImage: `repeating-linear-gradient(45deg, ${(accent || ink || {}).hex || "#888"} 0 10px, ${(bg || {}).hex || "#fff"} 10px 20px)` };
  if (d.demo === "squeeze") st.transform = "scaleY(1.6)";
  return h("div", { class: "card dont", style: { padding: 0 } },
    d.demo ? h("div", { class: "logobox", style: box }, h("img", { src: asset(primary.file), alt: "", style: st }), h("span", { class: "tag" }, T.no)) : null,
    h("div", { style: { padding: "12px 16px" } }, d.rule));
}

/* Mockups are drawn at their real size and scaled down; data-scale lets render.mjs check the logo against min_px. */
function mockup(a) {
  const darkBg = ink || { hex: "#111" };
  const kinds = {
    post: { w: 1080, h: 1080, view: 1, bgId: (darkBg || {}).id },
    card: { w: 321, h: 208, view: 1, bgId: (bg || {}).id, mm: true },
    email: { w: 600, h: 300, view: 1, bgId: (bg || {}).id },
    web: { w: 1440, h: 810, view: 1, bgId: (bg || {}).id }
  };
  const k = kinds[a.kind] || kinds.post;
  const bgc = byId[a.background] || byId[k.bgId] || bg || { hex: "#fff" };
  const fg = isDark(bgc.hex) ? (bg || { hex: "#fff" }).hex : (ink || { hex: "#111" }).hex;
  const lv = logoFor(bgc.id) || {};
  const minPx = k.mm ? Math.ceil((lv.min_mm || 20) * 3.7795) : (lv.min_px || 96);
  const logoW = Math.max(minPx, Math.round(k.w * (k.mm ? 0.42 : 0.2)));
  const canvas = h("div", { class: "canvas", style: { width: `${k.w}px`, height: `${k.h}px`, background: bgc.hex, color: fg, padding: `${Math.round(k.w * 0.07)}px`, display: "flex", flexDirection: "column", justifyContent: "space-between", boxSizing: "border-box" } },
    a.image ? h("img", { src: asset(a.image), alt: "", style: { position: "absolute", inset: "0", width: "100%", height: "100%", objectFit: "cover" } }) : null,
    h("img", { src: asset(lv.file), alt: B.meta.name, "data-logo": "", "data-min-px": minPx, style: { width: `${logoW}px`, height: "auto", position: "relative" } }),
    h("div", { style: { position: "relative" } },
      h("div", { style: { fontFamily: "var(--display)", fontWeight: 600, fontSize: `${Math.round(k.w * (k.mm ? 0.07 : 0.075))}px`, lineHeight: 1.05 } }, a.headline || ""),
      a.text ? h("div", { style: { marginTop: `${Math.round(k.w * 0.02)}px`, fontSize: `${Math.round(k.w * (k.mm ? 0.04 : 0.03))}px`, opacity: 0.85 } }, a.text) : null));
  const holder = h("div", { class: "mock", style: { aspectRatio: `${k.w} / ${k.h}` } }, canvas);
  const fit = () => { const s = holder.clientWidth / k.w; canvas.style.transform = `scale(${s})`; canvas.querySelectorAll("[data-logo]").forEach((el) => el.setAttribute("data-scale", s)); };
  new ResizeObserver(fit).observe(holder);
  return h("figure", {}, holder, h("figcaption", {}, a.title || a.kind));
}

/* page */
const main = document.getElementById("main");
const M = B.meta;
const primary = ((B.logo || {}).variants || [])[0];
main.append(h("div", { class: "cover", id: "top" },
  primary ? h("img", { class: "logo", src: asset(primary.file), alt: M.name }) : h("div", { class: "purpose" }, M.name),
  B.strategy && B.strategy.purpose ? h("p", { class: "purpose" }, B.strategy.purpose) : null,
  h("div", { class: "meta" },
    h("div", {}, `${T.version} ${M.version}, ${M.date}${M.status ? `, ${M.status === "approved" ? T.approved : T.draft}` : ""}`),
    M.owner ? h("div", {}, `${T.owner}: ${M.owner}${M.contact ? `, ${M.contact}` : ""}`) : null,
    M.made_by ? h("div", {}, `${T.madeBy}: ${M.made_by}`) : null)));

const tocItems = [];
for (const part of ORDER) {
  const items = part.items.filter((id) => has[id]);
  if (!items.length) continue;
  main.append(h("div", { class: "part", "data-part": part.part }, h("h1", {}, part.part === 1 ? T.part1 : T.part2), h("p", {}, part.part === 1 ? T.part1Lead : T.part2Lead)));
  items.forEach((id, i) => {
    const code = `${part.part}.${i + 1}`;
    main.append(section(id, code, build[id]()));
    tocItems.push({ id, code, part: part.part, title: T.topics[id] });
  });
}
main.append(h("footer", { class: "colophon" }, T.colophon(B)));

/* navigation */
const toc = document.getElementById("toc");
const menuLinks = document.getElementById("menu-links");
document.getElementById("menu-label").textContent = T.menu;
document.getElementById("skip").textContent = T.skip;
let lastPart = 0;
for (const it of tocItems) {
  if (it.part !== lastPart) { toc.append(h("p", {}, it.part === 1 ? T.part1 : T.part2)); lastPart = it.part; }
  toc.append(h("a", { href: `#${it.id}`, "data-for": it.id }, h("span", { class: "n" }, it.code), it.title));
  menuLinks.append(h("a", { href: `#${it.id}`, "data-for": it.id, onclick: () => (document.getElementById("menu").open = false) }, `${it.code} ${it.title}`));
}
const barBrand = document.getElementById("bar-brand");
barBrand.append(primary ? h("img", { src: asset(primary.file), alt: M.name, "data-logo": "", "data-min-px": primary.min_px, "data-scale": 1, style: { width: `${primary.min_px || 96}px` } }) : M.name, h("span", {}, `brandbook ${M.version}`));

/* reader filter: a real state, kept in the URL so a link can open the designer's view */
const readersEl = document.getElementById("readers");
readersEl.setAttribute("aria-label", T.reader);
readersEl.append(h("span", { class: "lab" }, T.reader));
function setReader(r) {
  for (const b of readersEl.querySelectorAll("button")) b.setAttribute("aria-pressed", b.dataset.r === r ? "true" : "false");
  for (const s of main.querySelectorAll("section.s")) s.hidden = r !== "all" && !s.dataset.readers.split(" ").includes(r);
  for (const p of main.querySelectorAll(".part")) {
    let n = p.nextElementSibling, any = false;
    while (n && !n.classList.contains("part") && n.tagName !== "FOOTER") { if (n.matches("section.s") && !n.hidden) any = true; n = n.nextElementSibling; }
    p.hidden = !any;
  }
  for (const a of document.querySelectorAll("[data-for]")) a.hidden = document.getElementById(a.dataset.for).hidden;
  const u = new URL(location.href); if (r === "all") u.searchParams.delete("reader"); else u.searchParams.set("reader", r);
  try { history.replaceState(null, "", u); } catch {}
}
for (const r of Object.keys(T.readers)) readersEl.append(h("button", { type: "button", "data-r": r, onclick: () => setReader(r) }, T.readers[r]));
const startReader = new URLSearchParams(location.search).get("reader");
setReader(T.readers[startReader] ? startReader : "all");

/* scrollspy */
const links = [...toc.querySelectorAll("a")];
const spy = new IntersectionObserver((entries) => {
  for (const e of entries) if (e.isIntersecting) for (const a of links) a.setAttribute("aria-current", a.dataset.for === e.target.id ? "true" : "false");
}, { rootMargin: "-20% 0px -70% 0px" });
main.querySelectorAll("section.s").forEach((s) => spy.observe(s));
window.addEventListener("beforeprint", () => setReader("all"));
window.__bookReady = document.fonts.ready.then(() => true);
</script>
</body>
</html>
