<style>
/*__FONT_FACES__*/
:root {
  --bg: #ffffff; --ink: #161616; --ink-2: #5e5e5e; --line: #dcdcdc; --accent: #2f2f2f; --panel: #f3f3f3;
  --feature: #161616; --on-feature: #ffffff;
  --display: system-ui, sans-serif; --text: system-ui, sans-serif;
  --nav: 232px; --gut: 56px; --max: 1120px; --indent: 120px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 var(--text); font-kerning: normal; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px; }
img { max-width: 100%; }
button { font: inherit; color: inherit; }
p { margin: 0 0 14px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
:lang(pl) q { quotes: "„" "”" "‚" "’"; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--ink); color: var(--bg); padding: 8px 12px; z-index: 10; }
.skip:focus { left: 8px; }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.k { font-size: 14px; color: var(--ink-2); margin: 0 0 8px; }

/* bar */
.bar { position: sticky; top: 0; z-index: 5; min-height: 60px; display: flex; align-items: center; gap: 24px; padding: 0 var(--gut) 0 28px; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar .brand { display: flex; align-items: center; gap: 16px; text-decoration: none; min-width: 0; }
.bar .brand img { height: auto; display: block; }
.bar .brand span { font-size: 14px; color: var(--ink-2); white-space: nowrap; }
.readers { margin-left: auto; display: flex; align-items: center; gap: 22px; }
.readers .lab { font-size: 14px; color: var(--ink-2); }
.readers button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 18px 0 16px; font-size: 15px; color: var(--ink-2); cursor: pointer; }
.readers button:hover { color: var(--ink); }
.readers button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.menu { display: none; }

/* layout */
.wrap { display: grid; grid-template-columns: var(--nav) minmax(0, 1fr); }
nav.toc { position: sticky; top: 60px; align-self: start; height: calc(100vh - 60px); overflow: auto; padding: 48px 20px 48px 28px; }
nav.toc p { margin: 30px 0 8px; font-size: 13px; color: var(--ink-2); }
nav.toc p:first-child { margin-top: 0; }
nav.toc a { display: flex; gap: 12px; padding: 5px 0; font-size: 15px; line-height: 1.35; text-decoration: none; color: var(--ink-2); }
nav.toc a .n { min-width: 26px; font-variant-numeric: tabular-nums; }
nav.toc a:hover, nav.toc a[aria-current="true"] { color: var(--ink); }
nav.toc a[aria-current="true"] .t { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }
main { min-width: 0; padding: 0 var(--gut) 160px; }

/* cover and parts: the brand's colour as a full field */
.cover { margin: 0 calc(var(--gut) * -1); min-height: calc(100vh - 61px); background: var(--feature); color: var(--on-feature); padding: 72px var(--gut) 56px; display: flex; flex-direction: column; }
.cover img.logo { height: clamp(48px, 7vw, 104px); width: auto; align-self: flex-start; }
.cover .word { font: 500 clamp(40px, 6vw, 80px)/1 var(--display); }
.cover .purpose { margin: auto 0 0; padding-top: 80px; font: 500 clamp(40px, 6vw, 96px)/1.02 var(--display); letter-spacing: -0.025em; max-width: 15ch; text-wrap: balance; }
.cover .meta { margin-top: 56px; display: flex; flex-wrap: wrap; gap: 8px 40px; font-size: 15px; opacity: 0.85; }
.part { margin: 150px calc(var(--gut) * -1) 0; padding: 140px var(--gut) 72px; background: var(--feature); color: var(--on-feature); min-height: 64vh; display: flex; flex-direction: column; justify-content: flex-end; }
.part .no { font-size: 15px; opacity: 0.8; margin: 0; }
.part h1 { margin: 10px 0 0; font: 500 clamp(64px, 10vw, 160px)/0.95 var(--display); letter-spacing: -0.035em; }
.part .lead2 { margin: 28px 0 0; max-width: 46ch; font-size: 20px; opacity: 0.9; }

/* sections */
section.s { max-width: var(--max); padding: 150px 0 0; scroll-margin-top: 80px; }
.part + section.s { padding-top: 120px; }
.s-head { display: grid; grid-template-columns: calc(var(--indent) - 24px) minmax(0, 1fr); gap: 0 24px; margin: 0 0 72px; }
.s-head .n { font: 400 22px/1.3 var(--display); color: var(--ink-2); padding-top: 0.4em; font-variant-numeric: tabular-nums; }
.s-head h2 { margin: 0; font: 500 clamp(36px, 4.4vw, 64px)/1.04 var(--display); letter-spacing: -0.022em; max-width: 17ch; text-wrap: balance; }
.s-head .topic { margin: 18px 0 0; font-size: 15px; color: var(--ink-2); }
.body { margin-left: var(--indent); }
h3 { font: 500 24px/1.25 var(--display); letter-spacing: -0.01em; margin: 96px 0 28px; padding-top: 22px; border-top: 1px solid var(--line); }
.body > h3:first-child, .body > .first { margin-top: 0; }
h4 { margin: 0 0 6px; font: 500 22px/1.25 var(--display); letter-spacing: -0.01em; }

/* rows: a definition list with hairlines */
.rows { border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2.4fr); gap: 6px 32px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.row > :first-child { color: var(--ink-2); font-size: 15px; padding-top: 2px; }
.row > :last-child { font-size: 18px; }
.cols { display: grid; gap: 40px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.col .v { font: 400 23px/1.35 var(--display); letter-spacing: -0.005em; margin: 0; }
ol.big, ul.big { list-style: none; margin: 0; padding: 0; counter-reset: n; }
ol.big li, ul.big li { position: relative; padding: 20px 0 20px 56px; border-bottom: 1px solid var(--line); font: 400 22px/1.4 var(--display); }
ol.big li:first-child, ul.big li:first-child { border-top: 1px solid var(--line); }
ol.big li::before { counter-increment: n; content: counter(n); position: absolute; left: 0; top: 24px; font: 400 16px/1 var(--text); color: var(--ink-2); }
ul.big li::before { content: ""; position: absolute; left: 0; top: 36px; width: 28px; height: 1px; background: var(--ink-2); }
ol.plain { margin: 0; padding-left: 1.2em; }
ol.plain li { margin: 6px 0; }

/* strategy */
.values { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 48px; }
.values h4 { font-size: 30px; margin-bottom: 10px; }
.values p { font-size: 18px; color: var(--ink-2); max-width: 36ch; margin: 0; }

/* voice */
.traits { display: grid; gap: 14px; }
.trait { margin: 0; font: 400 clamp(28px, 3.4vw, 46px)/1.15 var(--display); letter-spacing: -0.02em; }
.trait .isnot { color: var(--ink-2); }
.trait s { text-decoration-thickness: 2px; }
.tone { border-top: 1px solid var(--line); }
.tone-row { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr) minmax(0, 1.6fr); gap: 8px 32px; padding: 24px 0; border-bottom: 1px solid var(--line); }
.tone-row h4 { font-size: 22px; margin: 0; }
.tone-row p { margin: 0; }
.tone-row q { font: 400 22px/1.4 var(--display); }
.words { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
.words ul { list-style: none; margin: 0; padding: 0; font: 400 26px/1.45 var(--display); }
.words .no li { color: var(--ink-2); text-decoration: line-through; text-decoration-thickness: 2px; }
.ba { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 24px 0; border-bottom: 1px solid var(--line); }
.ba:first-of-type { border-top: 1px solid var(--line); }
.ba p { margin: 0; font: 400 24px/1.35 var(--display); }
.ba .before { color: var(--ink-2); text-decoration: line-through; text-decoration-thickness: 2px; }
.ba p.k { font: 14px/1.4 var(--text); color: var(--ink-2); margin: 0 0 8px; text-decoration: none; }

/* applications */
.mocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px 32px; }
.mock { position: relative; overflow: hidden; }
.mock .canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
figure { margin: 0; }
figcaption { margin-top: 12px; font-size: 14px; color: var(--ink-2); }
figcaption .gen { color: var(--ink); font-weight: 600; }

/* logo */
.lpanels { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 32px; }
.lpanel { aspect-ratio: 4 / 3; display: grid; place-items: center; padding: 10%; }
.lpanel img { width: 64%; height: auto; max-height: 64%; object-fit: contain; }
.lcap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 20px; margin-top: 14px; font-size: 15px; }
.lcap b { font-weight: 600; }
.clearpanel { background: var(--panel); display: grid; place-items: center; padding: 96px 24px; }
.clear { position: relative; display: inline-block; outline: 1px dashed var(--ink-2); }
.clear img { display: block; height: clamp(56px, 8vw, 104px); width: auto; }
.clear .x { position: absolute; font: 500 14px/1 var(--text); color: var(--ink-2); background: var(--panel); padding: 2px 6px; }
.minrow { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 32px 64px; }
.minrow img { display: block; height: auto; }
.donts { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 28px 24px; }
.dont .p { position: relative; aspect-ratio: 4 / 3; display: grid; place-items: center; overflow: hidden; background: var(--panel); }
.dont .p img { max-width: 56%; max-height: 40%; }
.dont .p::after { content: ""; position: absolute; left: -10%; right: -10%; top: 50%; height: 1.5px; background: var(--ink-2); transform: rotate(-24deg); opacity: 0.6; }
.dont p { margin: 12px 0 0; font-size: 16px; }

/* colour */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.tile { min-height: 340px; padding: 22px 22px 18px; display: flex; flex-direction: column; }
.tile h4 { font-size: 28px; margin: 0 0 4px; }
.tile .role { font-size: 14px; opacity: 0.8; margin: 0; }
.tile .vals { margin-top: auto; padding-top: 24px; display: grid; font-size: 14px; font-variant-numeric: tabular-nums; }
.tile .vals > * { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-top: 1px solid color-mix(in srgb, currentColor 24%, transparent); }
.tile .vals button { all: unset; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-top: 1px solid color-mix(in srgb, currentColor 24%, transparent); }
.tile .vals button:hover .v, .tile .vals button:focus-visible .v { text-decoration: underline; }
.tile .vals .kk { opacity: 0.75; }
.tile .status { margin: 10px 0 0; font-size: 12.5px; opacity: 0.8; }
.band { display: flex; height: 76px; }
.band div { display: flex; align-items: flex-end; padding: 10px 12px; font-size: 13px; overflow: hidden; white-space: nowrap; }
.scroll { overflow-x: auto; }
table.matrix { border-collapse: separate; border-spacing: 3px; font-size: 13px; margin-left: -3px; }
table.matrix th { font-weight: 500; text-align: left; padding: 6px 8px; white-space: nowrap; color: var(--ink-2); }
table.matrix td { padding: 0; }
table.matrix .cell { width: 120px; height: 108px; padding: 12px; display: flex; flex-direction: column; }
table.matrix .cell b { font: 500 30px/1 var(--display); }
table.matrix .cell .r { margin-top: auto; font-size: 13px; line-height: 1.3; }
table.matrix .ok-mark .cell { box-shadow: inset 0 0 0 3px var(--bg), inset 0 0 0 5px var(--ink); }
table.matrix .same { color: var(--ink-2); display: grid; place-items: center; }

/* type */
.specimen { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.6fr); gap: 32px 56px; padding: 40px 0 56px; border-top: 1px solid var(--line); }
.specimen .aa { font-size: clamp(120px, 15vw, 220px); line-height: 0.9; letter-spacing: -0.04em; }
.specimen h4 { font-size: 30px; }
.specimen .sample { font-size: clamp(26px, 3vw, 40px); line-height: 1.15; margin: 18px 0; overflow-wrap: anywhere; }
.specimen .glyphs { font-size: 19px; line-height: 1.55; color: var(--ink-2); overflow-wrap: anywhere; margin-bottom: 28px; }
.scale { border-top: 1px solid var(--line); }
.scale-row { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 24px; padding: 22px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.scale-row .meta { font-size: 14px; color: var(--ink-2); }
.scale-row .ex { overflow-wrap: anywhere; }

/* imagery */
.imgs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px; }
figure img { display: block; width: 100%; height: auto; }
.dodont { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }

/* labels */
.label + .label { margin-top: 112px; }
.label h4 { font-size: 30px; }
.lview { background: var(--panel); padding: 28px; margin-top: 24px; }
.modes { display: flex; gap: 24px; margin: 0 0 18px; }
.modes button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 4px 0; font-size: 15px; color: var(--ink-2); cursor: pointer; }
.modes button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.fw { overflow-x: auto; }
.lview iframe { width: 100%; border: 0; display: block; background: transparent; margin: 0 auto; }
.lview .open { display: inline-block; margin-top: 16px; font-size: 14px; }
.note { margin: 20px 0 0; padding-left: 16px; border-left: 2px solid var(--ink); font-size: 15px; max-width: 70ch; }
.lgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 56px; margin-top: 40px; }
@media (min-width: 900px) { .lgrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); } }
.lgrid h5 { font: 500 18px/1.3 var(--display); margin: 28px 0 12px; }
.lgrid h5:first-child { margin-top: 0; }
.check { display: flex; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.check b { min-width: 84px; font-size: 13px; font-weight: 600; color: var(--ink-2); padding-top: 2px; }
.check b.missing { color: var(--ink); }

.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; font-size: 14px; opacity: 0; transition: opacity 0.15s; pointer-events: none; }
.toast.on { opacity: 1; }
[hidden] { display: none !important; }
footer.colophon { max-width: var(--max); margin: 160px 0 0 var(--indent); padding-top: 22px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-2); }

@media (max-width: 1023px) {
  :root { --gut: 20px; --indent: 0px; }
  .wrap { grid-template-columns: minmax(0, 1fr); }
  nav.toc { display: none; }
  .bar { flex-wrap: wrap; padding: 10px 20px 0; gap: 4px 16px; }
  .readers { margin-left: 0; width: 100%; gap: 2px 16px; flex-wrap: wrap; }
  .readers .lab { width: 100%; font-size: 13px; }
  .readers button { padding: 8px 0; white-space: nowrap; font-size: 14.5px; }
  .menu { display: block; width: 100%; order: 3; }
  .menu summary { cursor: pointer; font-size: 15px; padding: 10px 0; }
  .menu a { display: block; padding: 10px 0; text-decoration: none; border-top: 1px solid var(--line); font-size: 15px; }
  .cover { min-height: 86vh; padding: 48px 20px 40px; }
  .part { margin-top: 96px; padding: 96px 20px 48px; min-height: 48vh; }
  section.s { padding-top: 96px; }
  .s-head { grid-template-columns: minmax(0, 1fr); margin-bottom: 40px; }
  .s-head .n { padding: 0 0 10px; font-size: 18px; }
  h3 { margin-top: 72px; }
  .row, .tone-row { grid-template-columns: minmax(0, 1fr); }
  .words, .ba, .dodont, .specimen { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tile { min-height: 250px; padding: 14px; }
  .tile h4 { font-size: 21px; }
  .tile .vals { font-size: 12.5px; }
  .scale-row { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  table.matrix .cell { width: 86px; height: 88px; padding: 8px; }
  table.matrix .cell b { font-size: 22px; }
  .lview { padding: 14px; }
  .lpanels, .mocks, .imgs { grid-template-columns: minmax(0, 1fr); }
}
@media print {
  @page { size: 297mm 210mm; margin: 12mm; }
  @page :first { margin: 0; }
  body { font-size: 9.5pt; line-height: 1.45; }
  .bar, nav.toc, .modes, .readers, .menu, .toast, .skip, .no-print, .lview .open { display: none !important; }
  .wrap { display: block; }
  main { padding: 0; }
  :root { --indent: 0px; }
  /* A full-colour cover, a coloured band at the top of each part's first page; sections flow. */
  .cover { margin: 0; width: 297mm; height: 210mm; min-height: 0; padding: 18mm 20mm; break-after: page; }
  .cover .purpose { font-size: 40pt; padding-top: 0; }
  .part { margin: 0 0 8mm; min-height: 0; padding: 12mm 10mm 8mm; break-before: page; }
  .part h1 { font-size: 40pt; }
  .part .lead2 { font-size: 11pt; margin-top: 3mm; }
  section.s { max-width: none; padding: 8mm 0 0; }
  .part + section.s { padding-top: 0; }
  .s-head { grid-template-columns: 12mm minmax(0, 1fr); margin-bottom: 5mm; }
  .s-head .n { font-size: 12pt; padding-top: 0.3em; }
  .s-head h2 { font-size: 20pt; max-width: none; }
  .s-head .topic { margin-top: 1mm; font-size: 8.5pt; }
  h3 { font-size: 12.5pt; margin: 6mm 0 3mm; padding-top: 2mm; }
  h4 { font-size: 11pt; }
  section.s > .s-head, h3, h5, .lhead { break-inside: avoid; break-after: avoid; }
  .row { padding: 1.5mm 0; grid-template-columns: 46mm minmax(0, 1fr); }
  .row > :first-child { font-size: 8.5pt; }
  .row > :last-child { font-size: 9.5pt; }
  .col .v, ol.big li, ul.big li, .tone-row q, .ba p, .words ul { font-size: 11pt; }
  ol.big li, ul.big li { padding: 2mm 0 2mm 9mm; }
  ol.big li::before { top: 2.4mm; font-size: 8pt; }
  ul.big li::before { top: 4.6mm; width: 5mm; }
  .values { gap: 5mm; } .values h4 { font-size: 13pt; } .values p { font-size: 9.5pt; }
  .trait { font-size: 17pt; }
  .tone-row, .ba { padding: 2.5mm 0; }
  .mocks { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5mm; }
  .lpanels { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4mm; }
  .lpanel { aspect-ratio: auto; height: 38mm; }
  .clearpanel { padding: 9mm; }
  .clear img { height: 16mm; }
  .donts { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4mm; }
  .dont .p { aspect-ratio: auto; height: 26mm; }

  .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }

  .tile .vals > *, .tile .vals button { padding: 0.6mm 0; }
  .tile .status { font-size: 7pt; }
  .band { height: 11mm; }
  table.matrix .cell { width: 18mm; height: 15mm; padding: 1.4mm; }
  table.matrix .cell b { font-size: 12pt; }
  table.matrix .cell .r { font-size: 7pt; }
  .specimen { padding: 4mm 0; grid-template-columns: 46mm minmax(0, 1fr); gap: 6mm; }
  .specimen .aa { font-size: 60pt; }
  .specimen .sample { font-size: 16pt; margin: 2mm 0; }
  .specimen .glyphs { font-size: 8.5pt; margin-bottom: 3mm; }
  .specimen .rows { columns: 2; column-gap: 8mm; border-top: 0; }
  .scale-row { padding: 2mm 0; }
  .label + .label { margin-top: 8mm; }
  .label h4 { font-size: 13pt; }
  .lview { padding: 3mm; margin-top: 2mm; }
  .lview iframe { max-height: 70mm; }
  .note { margin-top: 2mm; font-size: 8.5pt; }
  .lgrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); margin-top: 4mm; }
  .lgrid h5 { font-size: 10pt; margin: 3mm 0 1.5mm; }
  .check { padding: 1mm 0; font-size: 8.5pt; }
  figure, .mock, .scale-row, .check, .row, .tile, .dont, .specimen, .tone-row, .ba, .lview, .values > div, .lpanels > figure { break-inside: avoid; }

<a class="skip" href="#main" id="skip">Skip</a>
<header class="bar">
  <a class="brand" href="#top" id="bar-brand"></a>
  <div class="readers" role="group" id="readers"></div>
  <details class="menu" id="menu"><summary id="menu-label"></summary><div id="menu-links"></div></details>
</header>

  <nav class="toc" id="toc"></nav>

<script>

/* Mockups are drawn at their real size and scaled down; data-scale lets render.mjs check the logo against min_px. */
function mockup(a) {
  const kinds = {

    card: { w: 321, h: 208, bgId: (bg || {}).id, mm: true },
    email: { w: 600, h: 300, bgId: (bg || {}).id },

  const k = kinds[a.kind] || kinds.post;
  const bgc = byId[a.background] || byId[k.bgId] || bg || { hex: "#fff" };
  const fg = textOn(bgc.hex);
  const lv = logoFor(bgc.id) || {};
  const minPx = k.mm ? Math.ceil((lv.min_mm || 20) * 3.7795) : (lv.min_px || 96);
  const logoW = Math.max(minPx, Math.round(k.w * (k.mm ? 0.42 : 0.2)));
  const canvas = h("div", { class: "canvas", style: { width: `${k.w}px`, height: `${k.h}px`, background: bgc.hex, color: fg, padding: `${Math.round(k.w * 0.07)}px`, display: "flex", flexDirection: "column", justifyContent: "space-between", boxSizing: "border-box" } },
    a.image ? h("img", { src: asset(a.image), alt: "", style: { position: "absolute", inset: "0", width: "100%", height: "100%", objectFit: "cover" } }) : null,
    h("img", { src: asset(lv.file), alt: B.meta.name, "data-logo": "", "data-min-px": minPx, style: { width: `${logoW}px`, height: "auto", position: "relative" } }),
    h("div", { style: { position: "relative" } },
      h("div", { style: { fontFamily: "var(--display)", fontWeight: 500, fontSize: `${Math.round(k.w * (k.mm ? 0.07 : 0.08))}px`, lineHeight: 1.04, letterSpacing: "-0.02em" } }, a.headline || ""),
      a.text ? h("div", { style: { marginTop: `${Math.round(k.w * 0.02)}px`, fontSize: `${Math.round(k.w * (k.mm ? 0.04 : 0.03))}px`, opacity: 0.85 } }, a.text) : null));
  const holder = h("div", { class: "mock", style: { aspectRatio: `${k.w} / ${k.h}`, outline: !a.image && edge(bgc.hex) ? "1px solid var(--line)" : null, outlineOffset: "-1px" } }, canvas);

/* reader filter: a real state, kept in the URL so a link can open the designer's view */
const readersEl = document.getElementById("readers");

function setReader(r) {
  for (const b of readersEl.querySelectorAll("button")) b.setAttribute("aria-pressed", b.dataset.r === r ? "true" : "false");
  for (const s of main.querySelectorAll("section.s")) s.hidden = r !== "all" && !s.dataset.readers.split(" ").includes(r);
  for (const p of main.querySelectorAll(".part")) {
    let n = p.nextElementSibling, any = false;
    while (n && !n.classList.contains("part") && n.tagName !== "FOOTER") { if (n.matches("section.s") && !n.hidden) any = true; n = n.nextElementSibling; }

  for (const e of entries) if (e.isIntersecting) for (const a of links) a.setAttribute("aria-current", a.dataset.for === e.target.id ? "true" : "false");
}, { rootMargin: "-20% 0px -70% 0px" });
